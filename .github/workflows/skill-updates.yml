name: Skill updates

on:
  push:
    branches: [main]
    paths:
      - "imports.json"
      - "*/**"
      - "!scripts/**"
      - "!.github/**"
      - "!.cursor/**"
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: skill-updates
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: timmo001/dotfiles
          ref: distro/arch-omarchy-quattro
          path: .dotfiles
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Build dot
        run: |
          bun install --cwd .dotfiles/dot --frozen-lockfile
          bun run --cwd .dotfiles/dot build
      - name: Run skill updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: .dotfiles/scripts/.local/bin/dot skill-updates-agent github --skills-dir "$GITHUB_WORKSPACE"
