---
name: Skill updates

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "skills.yml"
      - "*/**"
      - "!scripts/**"
      - "!.github/**"
      - "!.cursor/**"
  repository_dispatch:
    types:
      - first-party-skill-updated
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: skill-updates
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SKILL_UPDATES_TOKEN }}
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install and build skill maintenance
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Run skill updates
        env:
          GH_TOKEN: ${{ secrets.SKILL_UPDATES_TOKEN }}
        run: ./dist/skill-maintenance updates-agent github --skills-dir "$GITHUB_WORKSPACE"
