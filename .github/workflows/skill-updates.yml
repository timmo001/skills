name: Skill updates

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: skill-updates
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
      - name: Check upstream imports
        run: python scripts/check_upstream.py --format json > skill-updates.json
      - name: Open upstream update pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'skill-updates[bot]'
          git config user.email 'skill-updates[bot]@users.noreply.github.com'
          mapfile -t skills < <(jq -r '.[] | select(.state == "update-available") | .name' skill-updates.json)
          for skill in "${skills[@]}"; do
            branch="skill-update/$skill"
            git checkout -B "$branch" origin/main
            python scripts/import_skill.py "$skill" --apply
            python scripts/validate.py
            python -m unittest discover -s scripts -p 'test_*.py'
            mise exec npm:skills -- skills add . --list
            git add -- imports.json
            if [[ -d "$skill" ]]; then
              git add -A -- "$skill"
            fi
            if [[ -d "upstream/$skill" ]]; then
              git add -A -- "upstream/$skill"
            fi
            git commit -m "Update skill: $skill"
            git push --force-with-lease origin "$branch"
            if url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')" && [[ -n "$url" ]]; then
              gh pr edit "$url" --title "Update skill: $skill" --add-assignee timmo001
            else
              gh pr create --base main --head "$branch" --title "Update skill: $skill" --body "Update the reviewed upstream snapshot for \`$skill\`." --assignee timmo001
            fi
            gh workflow run validate.yml --ref "$branch"
          done
          git checkout --detach origin/main
      - name: Refresh dashboard issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_upstream.py --format markdown > skill-updates.md
          marker='<!-- adapted-skill-updates -->'
          number="$(gh issue list --state open --limit 100 --json number,body --jq "map(select(.body | contains(\"$marker\")))[0].number // empty")"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --title 'Skill updates' --body-file skill-updates.md
          else
            gh issue create --title 'Skill updates' --body-file skill-updates.md
          fi
