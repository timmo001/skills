---
name: Validate

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      name: Validate skills
      task: validate
      smoke-test: |
        ./dist/skill-maintenance --completions bash >/dev/null
        ./dist/skill-maintenance --completions fish >/dev/null
        ./dist/skill-maintenance --completions zsh >/dev/null
        mise exec npm:skills -- skills add . --list
