---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@8a329a30ba4c078bf4b53424814cd1db6118d576 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@8a329a30ba4c078bf4b53424814cd1db6118d576 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@8a329a30ba4c078bf4b53424814cd1db6118d576 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@8a329a30ba4c078bf4b53424814cd1db6118d576 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@8a329a30ba4c078bf4b53424814cd1db6118d576 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@8a329a30ba4c078bf4b53424814cd1db6118d576 # master
    with:
      severity: warning
