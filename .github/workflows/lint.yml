---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@b72dc04e29a235128fd11578ac68994894bcfabc # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@b72dc04e29a235128fd11578ac68994894bcfabc # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@b72dc04e29a235128fd11578ac68994894bcfabc # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@b72dc04e29a235128fd11578ac68994894bcfabc # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@b72dc04e29a235128fd11578ac68994894bcfabc # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@b72dc04e29a235128fd11578ac68994894bcfabc # master
    with:
      severity: warning
