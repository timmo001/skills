---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@3677c61f9edc025528749995498bdbc93fbe21f3 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@3677c61f9edc025528749995498bdbc93fbe21f3 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@3677c61f9edc025528749995498bdbc93fbe21f3 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@3677c61f9edc025528749995498bdbc93fbe21f3 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@3677c61f9edc025528749995498bdbc93fbe21f3 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@3677c61f9edc025528749995498bdbc93fbe21f3 # master
    with:
      severity: warning
