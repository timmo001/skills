---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@7ac3ee6a5cacd7990795d77fea2f90a9848e5726 # master

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@7ac3ee6a5cacd7990795d77fea2f90a9848e5726 # master

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@7ac3ee6a5cacd7990795d77fea2f90a9848e5726 # master

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@7ac3ee6a5cacd7990795d77fea2f90a9848e5726 # master

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@7ac3ee6a5cacd7990795d77fea2f90a9848e5726 # master

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@7ac3ee6a5cacd7990795d77fea2f90a9848e5726 # master
    with:
      severity: warning
