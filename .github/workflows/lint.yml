---
name: Lint

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0

  shellcheck:
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
    with:
      severity: warning
