  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0

  markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@4562274d170ccaa4b5d5bc776684caaa8d61b007 # 20261002.0

  shellcheck:
