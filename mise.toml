[tools]
bun = "1.4.0"
node = "26.8.1"
"npm:skills" = "1.5.23"

[tasks.build]
run = "bun build src/index.ts --compile --outfile dist/skill-maintenance"

[tasks.lint]
run = "oxlint"

[tasks.typecheck]
run = "tsc --noEmit"

[tasks.test]
run = "bun run test"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.catalogue]
run = "bun run catalogue"
description = "Regenerate SKILLS.md from skill frontmatter"

[tasks.validate]
run = "bun run validate"
