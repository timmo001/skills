[tools]
bun = "1.4.4"
node = "26.13.1"
"npm:skills" = "1.8.1"
uv = "0.13.8"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[settings]
# The lockfile carries an embedded aube graph for npm tools.
npm.package_manager = "aube"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# Tasks that use node_modules depend on this, so they also run in a fresh
# clone, such as Upkeep's when the hk pre-push hook runs validate.
[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.build]
description = "Compile the skill-maintenance CLI"
depends = ["install"]
run = "bun build src/index.ts --compile --outfile dist/skill-maintenance"
sources = ["src/**/*.ts", "package.json", "bun.lock", "tsconfig.json"]
outputs = ["dist/skill-maintenance"]

[tasks.lint]
description = "Lint TypeScript with Oxlint"
depends = ["install"]
run = "oxlint"

[tasks."lint:yaml"]
description = "Lint YAML with yamllint"
run = "yamllint ."

[tasks.typecheck]
description = "Type-check the CLI source"
depends = ["install"]
run = "tsc --noEmit"

[tasks.test]
description = "Run the CLI tests against the built binary"
depends = ["build"]
run = "vitest run"

[tasks.format]
description = "Format the CLI source and Markdown with Prettier"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.catalogue]
description = "Regenerate SKILLS.md from skill frontmatter"
depends = ["build"]
run = "./dist/skill-maintenance catalogue"

[tasks."validate:skills"]
description = "Validate skills, imports and repository metadata"
depends = ["build"]
run = "./dist/skill-maintenance validate"

[tasks.schema]
description = "Generate skills.schema.json from the skills.yml schema"
depends = ["install"]
run = "bun src/generateSkillsSchema.ts"

[tasks."schema:check"]
description = "Check skills.schema.json matches the skills.yml schema"
depends = ["install"]
run = "bun src/generateSkillsSchema.ts --check"

[tasks.validate]
description = "Run every check in parallel"
depends = ["lint", "lint:yaml", "typecheck", "test", "format:check", "schema:check", "validate:skills"]
