[tools]
bun = "1.4.2"
node = "26.10.0"
"npm:skills" = "1.7.0"
uv = "0.12.23"
"pipx:yamllint" = "1.38.0"

[settings]
# The lockfile carries an embedded aube graph for npm tools.
npm.package_manager = "aube"

[tasks.build]
run = "bun build src/index.ts --compile --outfile dist/skill-maintenance"

[tasks.lint]
run = "oxlint"

[tasks.typecheck]
run = "tsc --noEmit"

[tasks.test]
run = "bun run test"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.catalogue]
run = "bun run catalogue"
description = "Regenerate SKILLS.md from skill frontmatter"

[tasks.validate]
run = "bun run validate"
